<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundPilot — Measure. Understand. Adjust. Verify.</title>
    <meta
      name="description"
      content="SoundPilot — Professional audio measurement and sound-system analysis tool for churches, auditoriums, and event centres."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/css/style.css" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <!-- Mobile nav overlay -->
    <div id="nav-overlay" class="nav-overlay" onclick="SP.nav.closeMobile()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-mark">
            <span class="logo-bar" style="height:40%"></span>
            <span class="logo-bar" style="height:70%"></span>
            <span class="logo-bar" style="height:45%"></span>
            <span class="logo-bar" style="height:25%"></span>
          </div>
          <div class="logo-text">
            <span class="logo-title">Sound<span class="logo-accent">Pilot</span></span>
            <span class="logo-tagline">Measure · Understand · Adjust · Verify</span>
          </div>
        </div>
        <button class="icon-btn mobile-only" onclick="SP.nav.closeMobile()" aria-label="Close menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <nav id="nav-menu" class="nav-menu"></nav>
      <div class="sidebar-footer">
        <span class="sidebar-tagline">MEASURE · UNDERSTAND · ADJUST · VERIFY</span>
      </div>
    </aside>

    <!-- Main content -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-only" onclick="SP.nav.openMobile()" aria-label="Open menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <div id="topbar-context" class="topbar-context"></div>
        </div>
        <div class="topbar-right">
          <span id="api-status-badge" class="badge badge-warning">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 25 20M11 6.5a10.94 10.94 0 0 1 8.82 5.5M12 20H5a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3h2"/></svg>
            Demo Mode
          </span>
          <span id="dsp-badge" class="badge badge-success hidden-mobile">
            <span class="pulse-dot"></span>
            DSP Online
          </span>
          <button class="icon-btn relative" aria-label="Alerts">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span id="alert-count" class="alert-badge"></span>
          </button>
        </div>
      </header>

      <main id="page-content" class="page-content"></main>
    </div>

    <!-- Scripts -->
    <script type="module" src="/src/js/app.js"></script>
  </body>
</html>
